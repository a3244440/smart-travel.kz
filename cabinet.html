<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/config.js"></script>
<title>Мои заявки — Alina Smart Travel</title>
</head>
<body data-page="cabinet">
<main class="wrap" style="padding-bottom:80px">
  <div class="page-head">
    <h1>Статус визы</h1>
    <p>Введите номер заявки и телефон, который указали при оформлении.</p>
  </div>
  <div class="grid" style="grid-template-columns:minmax(0,380px) 1fr">
    <form class="panel" id="lookup" novalidate>
      <div class="fields" style="grid-template-columns:1fr">
        <div class="f"><label for="aid">Номер заявки</label><input id="aid" placeholder="AST-XXXXXX" autocomplete="off" style="text-transform:uppercase"></div>
        <div class="f"><label for="aphone">Телефон</label><input id="aphone" type="tel" placeholder="+7 7__ ___ __ __"></div>
      </div>
      <div class="actions"><button class="btn" type="submit">Показать статус</button></div>
      <p class="toast bad" id="err" role="status" aria-live="polite" style="margin:14px 0 0"></p>
    </form>
    <div id="result"><div class="panel empty">Здесь появится ход оформления визы.</div></div>
  </div>
  <div id="mine" style="margin-top:40px"></div>
</main>
<script src="assets/store.js"></script>
<script src="assets/layout.js"></script>
<script>
(function(){
  const ORDER = ["new","review","submitted","approved"];
  const $ = s => document.querySelector(s);
  function names(a){ return a.travellers.map(t => [t.fields.given_names, t.fields.surname].filter(Boolean).join(" ")).filter(Boolean).join(", ") || "—"; }
  function show(a){
    const hist = {}; a.history.forEach(h => hist[h.status] = h.at);
    const steps = a.status === "fix"
      ? [...ORDER.slice(0, Math.max(1, ORDER.indexOf(a.history.filter(h=>h.status!=="fix").slice(-1)[0]?.status)+1)), "fix"]
      : ORDER;
    const curIdx = steps.indexOf(a.status);
    const items = steps.map((s,i) => {
      const cls = s==="fix" ? "fix" : i < curIdx ? "done" : i===curIdx ? "now" : "todo";
      const when = hist[s] ? `<small>${new Date(hist[s]).toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}</small>` : "";
      return `<li class="${cls}"><span class="node"></span><div>${STATUSES[s].label}${when}</div></li>`;
    }).join("");
    $("#result").innerHTML = `<div class="panel">
      <h3>Заявка ${esc(a.id)}</h3>
      <p class="sub">${esc(names(a))} · въезд ${esc(fmtDate(a.trip.arrival)) || "дата не указана"}</p>
      <ul class="timeline">${items}</ul>
      ${a.note ? `<div class="status ${a.status==="fix"?"error":""}" style="margin-top:4px"><b>Комментарий менеджера:</b> ${esc(a.note)}</div>` : ""}
      <div class="actions"><a class="btn ghost" href="${waLink("Здравствуйте! Вопрос по заявке " + a.id)}" target="_blank" rel="noopener">Написать менеджеру</a></div>
    </div>`;
  }
  $("#lookup").addEventListener("submit", e => {
    e.preventDefault();
    const id = $("#aid").value.trim(), phone = $("#aphone").value.trim();
    $("#err").textContent = "";
    if(!id || !phone){ $("#err").textContent = "Укажите номер заявки и телефон."; return; }
    const a = Store.find(id, phone);
    if(!a){ $("#err").textContent = "Заявка не найдена. Проверьте номер и телефон — или напишите менеджеру."; return; }
    show(a);
  });
  // заявки, отправленные с этого устройства
  const mine = Store.all();
  if(mine.length){
    $("#mine").innerHTML = `<h2 style="font-family:var(--serif);font-weight:400;font-size:28px;margin:0 0 14px">Заявки с этого устройства</h2>
      <div class="tabs">${mine.map(a => `<button class="tab" data-id="${esc(a.id)}"><span class="dot ${STATUSES[a.status].tone==="ok"?"done":STATUSES[a.status].tone==="err"?"error":STATUSES[a.status].tone==="warn"?"reading":""}"></span>${esc(a.id)} · ${esc(names(a))}</button>`).join("")}</div>`;
    $("#mine").addEventListener("click", e => { const b = e.target.closest("[data-id]"); if(b){ show(Store.find(b.dataset.id)); $("#result").scrollIntoView({behavior:"smooth",block:"start"}); } });
  }
  const q = new URLSearchParams(location.search).get("id");
  if(q){ $("#aid").value = q; const a = Store.find(q); if(a) show(a); }
})();
</script>
</body>
</html>
