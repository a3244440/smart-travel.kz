<script>
(function(){
  const P = v => I18N.pick(v);
  function render(){
    document.getElementById("guideList").innerHTML = GUIDES.map(g => {
      const name = P(g.name);
      const list = a => `<ul>${P(a).map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
      return `<article class="guide" id="${esc(g.id)}">
        <figure class="guide-ph"><img src="${esc(g.photo)}" alt="${esc(name)} — ${esc(P(g.role))}" loading="eager" decoding="async"></figure>
        <div class="guide-body">
          <span class="kicker">${esc(P(g.role))}</span>
          <h2>${esc(name)}</h2>
          <div class="guide-facts">${P(g.facts).map(f => `<span>${esc(f)}</span>`).join("")}</div>
          <p class="lead">${esc(P(g.about))}</p>
          <div class="guide-cols">
            <div><h3>${t("guide.exp")}</h3>${list(g.experience)}</div>
            <div><h3>${t("guide.edu")}</h3>${list(g.education)}</div>
          </div>
          <a class="btn" href="${waLink(t("guide.msg", { name }))}" target="_blank" rel="noopener">${t("guide.book")}</a>
        </div>
      </article>`;
    }).join("");
    document.getElementById("guideWa").href = waLink("");
  }
  render();
  document.addEventListener("langchange", render);
})();
</script>
