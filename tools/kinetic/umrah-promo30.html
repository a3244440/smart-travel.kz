<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="gGold" cx=".36" cy=".3" r=".78"><stop offset="0" stop-color="#FFF4D4"/><stop offset=".3" stop-color="#E3C27A"/><stop offset=".82" stop-color="#A8803A"/><stop offset="1" stop-color="#6E5020"/></radialGradient>
    <linearGradient id="gGoldStar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6E2AC"/><stop offset=".35" stop-color="#E3C27A"/><stop offset=".65" stop-color="#C9A15A"/><stop offset="1" stop-color="#E6D5B5"/></linearGradient>
    <radialGradient id="gEm" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#4DBE9A"/><stop offset=".3" stop-color="#1E8A6E"/><stop offset=".75" stop-color="#0F5C4A"/><stop offset="1" stop-color="#0A3A2F"/></radialGradient>
    <linearGradient id="gEmLin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2FA382"/><stop offset=".5" stop-color="#147A5F"/><stop offset="1" stop-color="#0B4A3B"/></linearGradient>
    <linearGradient id="gEmRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#46B893"/><stop offset=".45" stop-color="#1E8A6E"/><stop offset="1" stop-color="#0B3F33"/></linearGradient>
    <linearGradient id="gEmStar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E9C7D"/><stop offset=".45" stop-color="#1E8A6E"/><stop offset="1" stop-color="#0B3F33"/></linearGradient>

    <linearGradient id="gBand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F6E1A6"/><stop offset=".5" stop-color="#C9A15A"/><stop offset="1" stop-color="#8E6A2C"/></linearGradient>

<script>
window.TIMING = __TIMING__;
const W = 1080, H = 1920;
const T = window.TIMING, ph = id => T.phrases[id], pw = (id, d) => T.phrases[id] ?? d;   // pw — слово внутри фразы (если размечено)          // время фраз голоса (timing.json)
const DURATION = Math.max(30, T.voice_end + 1.6);
const HK = ph("hook"), L = ph("later"), K = ph("turnkey"), F = ph("format"), J = ph("journey"), G = ph("gen"), B = ph("brand");
const PUSH1 = L - .2, CUT2 = K - .1, WHIP = ph("values") - .35, CLR4 = F - .3, PUSH5 = J - .3, CLR6 = G - .25, G0 = G - .1;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, d) => clamp((t - a) / d);
const E = {
  out: t => 1 - Math.pow(1 - t, 3), in: t => t * t * t,
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  back: (t, c = 1.8) => 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2),
  expo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  elastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * 2 * Math.PI / 3) + 1,
  spring: t => t >= 1 ? 1 : 1 - Math.exp(-5.5 * t) * Math.cos(11 * t)
};
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(",")})`; };
const CUES = []; const cue = (t, type, o = {}) => CUES.push(Object.assign({ t: +t.toFixed(3), type }, o));
const U = [];                         // функции обновления кадра
const on = f => U.push(f);
const tf = ({ x = 0, y = 0, s = 1, sx = 1, sy = 1, r = 0, sk = 0 }) => `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${r.toFixed(2)}deg) skewX(${sk.toFixed(2)}deg) scale(${(s * sx).toFixed(4)},${(s * sy).toFixed(4)})`;
const blurF = b => b > .05 ? `blur(${b.toFixed(2)}px)` : "";
function el(p, css, html = "", cls = "ab"){ const d = document.createElement("div"); d.className = cls; d.style.cssText = css; d.innerHTML = html; p.appendChild(d); return d; }
const stage = document.getElementById("stage");
const GREY = "#9A9488", INK = "#1F2A27", EM = "#0F5C4A";

function scene(bg, lattice){
  const r = el(stage, "", "", "sc");
  el(r, `background-color:${bg}`, "", "bg");
  if (lattice) el(r, "inset:0;opacity:.07", `<svg width="1080" height="1920"><rect width="1080" height="1920" fill="url(#lat)" mask="url(#mCorners)"/></svg>`);
  return r;
}

// строка текста с пословным появлением (размытие → резкость, серый → тёмный)
function line(p, o){
  const al = o.align || "left";
  const pos = al === "center" ? "left:0;width:1080px;text-align:center" : al === "right" ? `right:${1080 - o.x}px;text-align:right` : `left:${o.x}px`;
  const c = el(p, `${pos};top:${o.y}px;font:${o.style || "normal"} ${o.weight || 700} ${o.size}px ${o.font};color:${o.color || INK};letter-spacing:${o.ls || 0}em;text-shadow:${o.shadow || "0 6px 16px rgba(110,80,40,.14)"}`, "", "ln");
  const inner = el(c, `position:relative;transform-origin:${al === "center" ? "50%" : al === "right" ? "100%" : "0"} 50%;transform:scaleX(${o.cond || 1})`, "", "");
  inner.className = "";
  const words = o.words.map(([txt, at, wo = {}], i) => {
    const s = document.createElement("span"); s.className = "w"; s.textContent = txt;
    if (i < o.words.length - 1 && !wo.nosp) s.style.marginRight = (o.gap ?? .24) + "em";
    if (wo.css) s.style.cssText += wo.css;
    inner.appendChild(s);
    const from = wo.from || o.from || GREY, to = wo.color || o.color || INK;
    if (!wo.silent) cue(at, "pop", { v: .55 });
    on(t => {
      const pp = P(t, at, .34), q = E.out(pp);
      let st = { o: t < at ? 0 : clamp(pp * 2.4), y: 26 * (1 - q), blur: 16 * (1 - q), col: mix(from, to, E.out(P(t, at + .04, .4))) };
      if (wo.f) st = Object.assign(st, wo.f(t, at) || {});
      s.style.opacity = st.o; s.style.transform = tf(st); s.style.filter = blurF(st.blur); s.style.color = st.col;
    });
    return s;
  });
  c.words = words; c.inner = inner;
  return c;
}

// вогнутая четырёхконечная звезда
const starPath = (R, k = .2) => { const r = R * k; return `M0,${-R} Q${r},${-r} ${R},0 Q${r},${r} 0,${R} Q${-r},${r} ${-R},0 Q${-r},${-r} 0,${-R}Z`; };
const starSVG = (R, fill) => `<svg width="${R * 2}" height="${R * 2}" viewBox="${-R} ${-R} ${R * 2} ${R * 2}"><g filter="url(#soft)"><path d="${starPath(R)}" fill="url(#${fill})"/><path d="${starPath(R * .9)}" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3" transform="translate(-6,-6)"/><ellipse cx="${-R * .12}" cy="${-R * .14}" rx="${R * .1}" ry="${R * .06}" fill="url(#gSpec)" opacity=".8"/></g></svg>`;
const sphereSVG = (d, fill = "gGold") => `<svg width="${d}" height="${d}" viewBox="0 0 100 100"><g filter="url(#soft)"><circle cx="50" cy="50" r="48" fill="url(#${fill})"/><ellipse cx="34" cy="28" rx="14" ry="9" fill="url(#gSpec)"/></g></svg>`;

// ===================== 0.0–0.8 карточка-крючок =====================
const S1 = scene("#FFFDF8", false);
const cardG = el(S1, "left:0;top:0;width:1080px;height:1920px");
const card = el(cardG, `left:110px;bottom:${1920 - 1080}px;width:14px;height:0;border-radius:7px;overflow:hidden;background:linear-gradient(160deg,#16735C,#0F5C4A 55%,#0C4E3F);box-shadow:0 26px 50px rgba(15,70,55,.28),inset 0 2px 0 rgba(255,255,255,.18)`);
const hook1 = line(card, { x: 52, y: 52, size: 94, font: "GR", weight: 900, color: "#FFFFFF", from: "#CFC9BE", shadow: "none", words: [["Мечтаешь", HK]] });
const hook2 = line(card, { x: 52, y: 160, size: 94, font: "GR", weight: 900, color: "#FFFFFF", from: "#CFC9BE", shadow: "none", words: [["об", pw("hook2", HK + .45)], ["Умре?", pw("hook3", HK + .68)]] });
const sph = el(cardG, "left:0;top:0;width:120px;height:120px", sphereSVG(120));
cue(HK + .1, "pop", { v: .6, pitch: 1.2 });
cue(PUSH1, "whoosh");
on(t => {
  const h = 300 * E.out(P(t, HK - .25, .2)), w = lerp(14, 780, E.back(P(t, HK - .09, .28), 1.2));
  card.style.height = h + "px"; card.style.width = w + "px"; card.style.borderRadius = Math.min(16, w / 2) + "px";
  const sp = P(t, HK + .1, .4);
  sph.style.opacity = t < HK + .1 ? 0 : clamp(sp * 3);
  sph.style.transform = tf({ x: 110 + w - 70, y: 1080 - h - 62 + Math.sin(t * 9) * 9, s: lerp(.2, 1, E.back(sp, 2.2)) });
  const q = E.in(P(t, PUSH1, .15));
  cardG.style.transformOrigin = "500px 930px";
  cardG.style.transform = tf({ s: lerp(1, 2.5, q) * (1 + .012 * Math.sin(t * 2.4)), y: -1500 * q });
});

// ===================== 0.8–1.4 «но всё откладываешь на потом?» =====================
const S2 = scene("#FFFDF8", false);
const blob = (cx, cy, R, ph) => { let d = ""; for (let i = 0; i <= 64; i++) { const a = i / 64 * Math.PI * 2, r = R * (1 + .13 * Math.sin(3 * a + ph) + .07 * Math.sin(5 * a - ph * 1.3)); d += (i ? "L" : "M") + (cx + Math.cos(a) * r).toFixed(1) + "," + (cy + Math.sin(a) * r).toFixed(1); } return d + "Z"; };
const s2svg = el(S2, "left:0;top:0", `<svg width="1080" height="1920"><path id="rib" d="M-260,1820 C200,1560 520,980 760,700 S1100,240 1400,120" fill="none" stroke="#EADFCB" stroke-width="300" stroke-linecap="round"/><path id="b1" fill="#EBD9A8" opacity=".85"/><path id="b2" fill="#EBD9A8" opacity=".85"/></svg>`);
const rib = s2svg.querySelector("#rib"), ribL = 2600;
rib.style.strokeDasharray = ribL;
const b1 = s2svg.querySelector("#b1"), b2 = s2svg.querySelector("#b2");
line(S2, { x: 110, y: 690, size: 140, font: "GR", weight: 900, color: EM, words: [["но", L]] });
line(S2, { x: 110, y: 860, size: 108, font: "PF", style: "italic", weight: 900, cond: .8, words: [["всё", pw("later2", L + .3)], ["откладываешь", pw("later3", L + .5)]] });
const later = line(S2, { x: 985, y: 1000, size: 170, font: "PF", style: "italic", weight: 900, cond: .86, align: "right", words: [["на", pw("later4", L + 1.2)], ["потом?", pw("later5", L + 1.42)]] });
on(t => {
  rib.style.strokeDashoffset = ribL * (1 - E.out(P(t, PUSH1, .9)));
  b1.setAttribute("d", blob(60, 260, 230, t * 3)); b2.setAttribute("d", blob(1030, 1700, 260, t * 3 + 2));
  const p = P(t, pw("later5", L + 1.42) + .04, .3);
  later.inner.style.transform = `scaleX(.86) rotate(${(t < pw("later5", L + 1.42) + .04 ? 0 : 7 * Math.exp(-5 * p) * Math.sin(p * 22)).toFixed(2)}deg)`;
});

// ===================== 1.4–3.4 «Умра под ключ», куб, счётчик, состав =====================
const S3 = scene("#F3EDE2", true);
const head3a = line(S3, { y: 210, size: 104, font: "GR", weight: 900, align: "center", words: [["Умра", K]] });
const head3b = line(S3, { y: 326, size: 112, font: "PF", style: "italic", weight: 700, align: "center", words: [["под", pw("turnkey2", K + .35)], ["ключ", pw("turnkey3", K + .55)]] });
const grp = el(S3, "left:0;top:0;width:1080px;height:1920px");
const C = 2 * Math.PI * 255;
const ring = el(grp, "left:265px;top:545px", `<svg width="550" height="550" viewBox="0 0 550 550"><defs><mask id="mRing" maskUnits="userSpaceOnUse" x="0" y="0" width="550" height="550"><circle id="rm" cx="275" cy="275" r="255" fill="none" stroke="#fff" stroke-width="30" stroke-dasharray="${C}" transform="rotate(-90 275 275)"/></mask></defs><circle cx="275" cy="275" r="255" fill="none" stroke="#C9A15A" stroke-width="7" stroke-linecap="round" stroke-dasharray="0.1 21" mask="url(#mRing)"/></svg>`);
const rm = ring.querySelector("#rm");
const cube = el(grp, "left:380px;top:640px;width:320px;height:340px;transform-origin:50% 100%", `<svg width="320" height="340" viewBox="0 0 320 340">
  <ellipse cx="160" cy="328" rx="150" ry="18" fill="url(#gShadow)"/>
  <g filter="url(#soft)">
  <polygon points="20,80 160,140 160,320 20,260" fill="url(#gLeft)"/>
  <polygon points="160,140 300,80 300,260 160,320" fill="url(#gRight)"/>
  <polygon points="160,20 300,80 160,140 20,80" fill="url(#gTop)"/>
  <polygon points="20,122 160,182 160,206 20,146" fill="url(#gBand)"/>
  <polygon points="160,182 300,122 300,146 160,206" fill="url(#gBand)"/>
  <polygon points="20,250 160,310 160,320 20,260" fill="#C9A15A" opacity=".35"/>
  <polygon points="160,140 300,80 300,150 160,210" fill="#fff" opacity=".07"/>
  <path d="M20,80 L160,140 L300,80 M160,140 V320" stroke="#6a6a6a" stroke-width="1.5" fill="none" opacity=".7"/>
  <ellipse cx="120" cy="66" rx="40" ry="10" fill="url(#gSpec)" opacity=".35"/></g></svg>`);
const ctr = el(grp, "right:430px;top:1080px;text-align:right;font:900 196px NU;color:#0F5C4A;line-height:1;text-shadow:0 0 28px rgba(227,194,122,.75),0 0 70px rgba(227,194,122,.4),0 8px 18px rgba(80,60,20,.18);white-space:nowrap", "0");
const days = line(grp, { x: 676, y: 1150, size: 96, font: "PF", style: "italic", weight: 700, words: [["дней", ph("days14") + .2, { f: (t, at) => { const p = P(t, at, .4); return { y: -70 * (1 - E.back(p, 2.4)) }; } }]] });

  pinSh.style.opacity = t < G + .1 ? 0 : clamp(grow * 2);
  pinSh.style.transform = `scale(${Math.max(.05, E.out(grow)).toFixed(3)})`;
  if (!fpL) { fpL = fpm.getTotalLength(); fpm.style.strokeDasharray = fpL; }
  const fq = E.inOut(P(t, B + .5, .26));
  fpm.style.strokeDashoffset = fpL * (1 - fq);
  fpd.style.opacity = t < B + .5 ? 0 : 1;
  const pt = fpm.getPointAtLength(fpL * fq), pb = fpm.getPointAtLength(Math.max(0, fpL * fq - 6));
  let ang = Math.atan2(pt.y - pb.y, pt.x - pb.x) * 180 / Math.PI - 180;
  const land = P(t, B + .76, .35);
  const bounce = t > B + .76 ? -16 * Math.exp(-7 * land) * Math.abs(Math.sin(land * 9)) : 0;
  if (t > B + .76) ang = lerp(ang, -8, E.out(land));
  plane.style.opacity = t < B + .5 ? 0 : 1;
  plane.style.transform = `translate(${(pt.x + 62).toFixed(1)}px,${(pt.y - 36 + bounce).toFixed(1)}px) rotate(${ang.toFixed(2)}deg) scale(${lerp(.8, 1, fq).toFixed(3)})`;
});

// ===================== переходы между сценами =====================
const hbv = document.getElementById("hbv"), vbv = document.getElementById("vbv");

  const vis = [t < PUSH1 + .19, t >= PUSH1 - .02 && t < CUT2, t >= CUT2 && t < WHIP + .22, t >= WHIP - .02 && t < CLR4 + .3, t >= CLR4 + .3 && t < PUSH5 + .22, t >= PUSH5 - .02 && t < G0, t >= G0];
  SC.forEach((s, i) => { s.style.display = vis[i] ? "" : "none"; s.style.transform = ""; s.style.filter = ""; });
  let hb = 0, vb = 0;
  // 0.65: карточка улетает, следующий кадр выталкивает снизу
  const a = E.inOut(P(t, PUSH1 + .01, .17)); if (t > PUSH1 + .01 && t < PUSH1 + .19) { S1.style.transform = `translateY(${-H * a}px)`; S2.style.transform = `translateY(${H * (1 - a)}px)`; vb = 50 * Math.sin(Math.PI * a); S1.style.filter = S2.style.filter = "url(#vblur)"; }
  // 3.3: резкий свайп влево с горизонтальным смазом
  const b = E.inOut(P(t, WHIP, .2)); if (t > WHIP && t < WHIP + .2) { S3.style.transform = `translateX(${-W * b}px)`; S4.style.transform = `translateX(${W * (1 - b)}px)`; hb = 80 * Math.sin(Math.PI * b); S3.style.filter = S4.style.filter = "url(#hblur)"; }
  else if (t <= WHIP) S4.style.transform = `translateX(${W}px)`;
  // 7.3: толчок вверх
  const c = E.inOut(P(t, PUSH5, .2)); if (t > PUSH5 && t < PUSH5 + .2) { S5.style.transform = `translateY(${-H * c}px)`; S6.style.transform = `translateY(${H * (1 - c)}px)`; vb = 70 * Math.sin(Math.PI * c); S5.style.filter = S6.style.filter = "url(#vblur)"; }
  else if (t <= PUSH5) S6.style.transform = `translateY(${H}px)`;
  hbv.setAttribute("stdDeviation", `${hb.toFixed(1)} 0`); vbv.setAttribute("stdDeviation", `0 ${vb.toFixed(1)}`);
  U.forEach(f => f(t));
};
