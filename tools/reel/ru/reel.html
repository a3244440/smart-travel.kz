<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:400;src:url(f/manrope-latin-400-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:M;font-weight:600;src:url(f/manrope-latin-600-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:M;font-weight:800;src:url(f/manrope-latin-800-normal.woff2);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:C;font-style:italic;font-weight:500;src:url(f/cormorant-garamond-latin-500-italic.woff2);unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:C;font-style:italic;font-weight:500;src:url(f/cormorant-garamond-cyrillic-500-italic.woff2);unicode-range:U+0400-045F}
@font-face{font-family:M;font-weight:400;src:url(f/manrope-cyrillic-400-normal.woff2);unicode-range:U+0400-045F}
@font-face{font-family:M;font-weight:600;src:url(f/manrope-cyrillic-600-normal.woff2);unicode-range:U+0400-045F}
@font-face{font-family:M;font-weight:800;src:url(f/manrope-cyrillic-800-normal.woff2);unicode-range:U+0400-045F}
:root{--navy:#0E1636;--navy2:#16224F;--gold:#D9B26A;--gold2:#F0D193;--ivory:#FFF8EC;--sun:#E8935A}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--navy);font-family:M,sans-serif;-webkit-font-smoothing:antialiased}
.L{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.abs{position:absolute}
img{display:block}
/* HUD */
#hud{position:absolute;inset:0;z-index:50;pointer-events:none;color:#fff;mix-blend-mode:difference;font:600 15px/1 M;letter-spacing:.18em;text-transform:uppercase}
#hud .tl{left:64px;top:52px}#hud .tr{right:64px;top:52px;font-variant-numeric:tabular-nums}
#hud .bl{left:64px;bottom:52px;overflow:hidden;height:18px}#hud .br{right:64px;bottom:58px;width:260px;height:2px;background:rgba(255,255,255,.25)}
#hud .br i{position:absolute;left:0;top:0;bottom:0;background:#fff}
#hud .cm{position:absolute;width:22px;height:22px;border:solid #fff;opacity:.8}
#sec{display:block;will-change:transform}
/* S1 */
#s1svg{position:absolute;left:0;top:0}
/* S2 */
#s2clip{position:absolute;inset:0}
#s2clip img{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover;object-position:50% 70%}
#word2{position:absolute;left:0;right:0;top:300px;text-align:center;white-space:nowrap;font:800 246px/1 M;letter-spacing:-.045em;color:var(--ivory);text-shadow:0 14px 60px rgba(120,60,10,.3)}
#word2 span{display:inline-block}
#tag2{position:absolute;left:0;right:0;top:220px;text-align:center;font:italic 500 46px/1 C;color:#fff;letter-spacing:.01em}
/* S3 */
.bigw{position:absolute;left:0;right:0;top:50%;text-align:center;white-space:nowrap;font:800 360px/1 M;letter-spacing:-.05em;transform:translateY(-54%)}
.bigw span{display:inline-block;will-change:transform}
.mask{display:inline-block;overflow:hidden;padding:0 .02em;vertical-align:top}
#stack div{font:800 180px/.92 M;letter-spacing:-.045em;text-align:center}
/* S4 */
#map{position:absolute;inset:0}
.lab{position:absolute;font:600 15px/1 M;letter-spacing:.2em;color:var(--ivory);white-space:nowrap}
.lab b{display:block;font:800 30px/1 M;letter-spacing:-.01em;margin-top:6px;color:#fff}
.lab.g b{color:var(--gold)}
#km{position:absolute;left:120px;top:150px;color:#fff}
#km .n{font:800 150px/1 M;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
#km .n small{font-size:60px;letter-spacing:0;margin-left:14px;color:var(--gold)}
#km .s{font:600 17px/1 M;letter-spacing:.24em;color:rgba(255,248,236,.7);margin-top:14px}
/* S5 */
.card{position:absolute;width:420px;height:580px;border-radius:30px;background:#fff;overflow:hidden;box-shadow:0 40px 80px -30px rgba(14,22,54,.45);transform-origin:50% 100%}
.card .ph{position:absolute;left:0;right:0;top:0;height:360px;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .ph:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,22,54,.1),rgba(14,22,54,0) 35%,rgba(14,22,54,.8))}
.card .chip{position:absolute;left:20px;top:20px;z-index:2;background:rgba(255,255,255,.92);color:var(--navy);font:800 13px/1 M;letter-spacing:.08em;padding:9px 13px;border-radius:99px}
.card h3{position:absolute;left:26px;top:290px;z-index:2;margin:0;font:800 40px/1 M;letter-spacing:-.03em;color:#fff}
.card .ln{position:absolute;left:26px;height:12px;border-radius:6px;background:#EFE8DA}
.card .bt{position:absolute;left:26px;right:26px;bottom:24px;height:54px;border-radius:99px;background:var(--navy);color:#fff;font:800 16px/54px M;text-align:center;letter-spacing:.02em}
.card.y{box-shadow:0 0 0 2px var(--gold),0 40px 80px -30px rgba(14,22,54,.45)}
.card.y .bt{background:var(--gold);color:var(--navy)}
#cursor{position:absolute;width:44px;height:44px;z-index:9}
#ripple{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid var(--gold);z-index:8}
#s5title{position:absolute;left:0;right:0;top:110px;text-align:center;font:800 64px/1 M;letter-spacing:-.04em;color:var(--navy)}
#s5title em{font:italic 500 70px/1 C;letter-spacing:0;color:#9C7224}
/* S6 */
#s6bg{position:absolute;inset:-5%;width:110%;height:110%;object-fit:cover}
#s6sh{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(14,22,54,.62),rgba(14,22,54,.92))}
.gauge{position:absolute;top:290px;width:420px;height:420px}
.gauge svg{position:absolute;inset:0;overflow:visible}
.gauge .num{position:absolute;left:0;right:0;top:132px;text-align:center;color:#fff;font:800 120px/1 M;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.gauge .num small{font-size:70px;color:var(--gold);letter-spacing:0}
.gauge .cap{position:absolute;left:0;right:0;top:270px;text-align:center;font:600 16px/1.4 M;letter-spacing:.24em;color:rgba(255,248,236,.75)}
/* S7 */
.tile{position:absolute;width:476px;height:356px;overflow:hidden;border-radius:4px;backface-visibility:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
#zero1{position:absolute;left:0;right:0;top:50%;text-align:center;font:800 760px/1 M;letter-spacing:-.07em;color:transparent;-webkit-background-clip:text;background-clip:text;background-size:2400px auto;background-repeat:no-repeat;transform:translateY(-52%)}
#s7cap{position:absolute;left:0;right:0;top:850px;text-align:center;font:600 22px/1 M;letter-spacing:.42em;color:var(--ivory)}
/* S8 */
#pc{position:absolute;inset:0}
#lock{position:absolute;left:0;right:0;top:330px;text-align:center}
#lockW{font:800 200px/1 M;letter-spacing:-.045em;color:var(--ivory);white-space:nowrap;position:relative;display:inline-block}
#lockW .sh{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.95) 48%,transparent 66%);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:300% 100%}
#lockL{width:0;height:3px;background:var(--gold);margin:34px auto 0}
#lockT{font:600 22px/1 M;letter-spacing:.5em;color:var(--gold);margin-top:34px;white-space:nowrap}
#lockT span{display:inline-block}
#logo8{position:absolute;left:50%;top:790px;width:390px;height:70px;margin-left:-195px}
#logo8 i{position:absolute;inset:0;-webkit-mask:url(m/logo-ink.png) center/contain no-repeat;mask:url(m/logo-ink.png) center/contain no-repeat;background:#fff}
#logo8 i+i{-webkit-mask-image:url(m/logo-gold.png);mask-image:url(m/logo-gold.png);background:var(--gold)}
#url8{position:absolute;left:0;right:0;top:900px;text-align:center;font:600 20px/1 M;letter-spacing:.32em;color:rgba(255,248,236,.7)}
#flash{position:absolute;inset:0;z-index:40;background:#fff;opacity:0;pointer-events:none}
#grain{position:absolute;inset:-50%;z-index:45;opacity:.05;pointer-events:none;mix-blend-mode:overlay}
#vig{position:absolute;inset:0;z-index:44;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.35))}
</style></head><body>

<!-- S1 форма -->
<div class="L" id="S1" style="background:var(--navy)">
  <svg id="s1svg" width="1920" height="1080" viewBox="0 0 1920 1080">
    <g id="s1star" transform="translate(960 560)" fill="none" stroke="#D9B26A" stroke-width="1.2"></g>
    <g id="s1arches" fill="none" stroke="#D9B26A" stroke-linecap="round"></g>
    <rect id="s1line" fill="#D9B26A"/>
    <circle id="s1dot" fill="#D9B26A"/>
  </svg>
  <div id="s1parts"></div>
</div>

<!-- S2 глубина -->
<div class="L" id="S2" style="background:var(--navy)">
  <div id="s2clip">
    <img id="s2bg" src="m/hero-bg.webp">
    <div id="tag2">зов двух священных мечетей</div>
    <div id="word2"></div>
    <img id="s2fg" src="m/hero-fg.webp">
  </div>
</div>

<!-- S3 типографика -->
<div class="L" id="S3">
  <div class="bigw" id="w1"></div><div class="bigw" id="w2" style="perspective:1200px"></div><div class="bigw" id="w3"></div>
  <div id="stack" class="abs" style="left:0;right:0;top:50%"></div>
</div>

<!-- S4 карта -->
<div class="L" id="S4" style="background:var(--navy)">
  <canvas id="map" width="1920" height="1080"></canvas>
  <div id="labs"></div>
  <div id="km"><div class="n"><span id="kmn">0</span><small>КМ</small></div><div class="s">АЛМАТЫ · АСТАНА → МЕККА · МЕДИНА</div></div>
</div>

<!-- S5 интерфейс -->
<div class="L" id="S5" style="background:#F4EEE2">
  <div id="s5title">Выбери свой <em>ритм</em></div>
  <div id="cards"></div>
  <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 9-6.5 1.6L16 20l-3 1.4-3.4-7.3L4 18Z" fill="#0E1636" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>
  <div id="ripple"></div>
</div>

<!-- S6 цифры -->
<div class="L" id="S6" style="background:var(--navy)">
  <img id="s6bg" src="m/kaaba-crowd.jpg"><div id="s6sh"></div>
  <div id="gauges"></div>
</div>

<!-- S7 маски и сетка -->
<div class="L" id="S7" style="background:var(--navy);perspective:1600px">
  <div id="tiles"></div>
  <div id="zero1">01</div>
  <div id="s7cap">UMRA YOUTH · ОТКРЫТ НАБОР</div>
</div>

<!-- S8 логотип -->
<div class="L" id="S8" style="background:radial-gradient(ellipse at 50% 45%,#1B2A60,#0E1636 70%)">
  <canvas id="pc" width="1920" height="1080"></canvas>
  <div id="lock"><div id="lockW">UMRA YOUTH<span class="sh">UMRA YOUTH</span></div><div id="lockL"></div><div id="lockT"></div></div>
  <div id="logo8"><i></i><i></i></div>
  <div id="url8">SMART-TRAVEL.KZ</div>
</div>

<div id="flash"></div><canvas id="grain" width="512" height="512"></canvas><div id="vig"></div>
<div id="hud">
  <div class="abs tl">smart-travel.kz <span style="opacity:.5">/</span> моушн-рил 2026</div>
  <div class="abs tr" id="tc">00:00</div>
  <div class="abs bl"><span id="sec"></span></div>
  <div class="abs br"><i id="prog"></i></div>
  <i class="cm" style="left:30px;top:30px;border-width:2px 0 0 2px"></i><i class="cm" style="right:30px;top:30px;border-width:2px 2px 0 0"></i>
  <i class="cm" style="left:30px;bottom:30px;border-width:0 0 2px 2px"></i><i class="cm" style="right:30px;bottom:30px;border-width:0 2px 2px 0"></i>
</div>

<script>
const W=1920,H=1080,DUR=15;
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const k=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,x)=>a+(b-a)*x;
const E={
  outExpo:x=>x>=1?1:1-Math.pow(2,-10*x), inExpo:x=>x<=0?0:Math.pow(2,10*x-10),
  ioExpo:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
  outCubic:x=>1-Math.pow(1-x,3), inCubic:x=>x*x*x, ioCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  outBack:(x,s=1.9)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2),
  spring:x=>x>=1?1:1-Math.exp(-7*x)*Math.cos(14*x), outQuint:x=>1-Math.pow(1-x,5)
};
let seed=1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const show=(id,on)=>{$(id).style.visibility=on?'visible':'hidden'};
const css=(el,o)=>{for(const p in o)el.style[p]=o[p]};

/* ---------- HUD ---------- */
const SECS=[[0,'01 — Форма'],[1.5,'02 — Глубина и параллакс'],[3.5,'03 — Кинетическая типографика'],[5.5,'04 — Карта данных'],[8,'05 — Анимация интерфейса'],[10,'06 — Инфографика'],[11.5,'07 — Маски и сетки'],[13,'08 — Сборка логотипа']];
function hud(t){
  const rt=t*(window.TS||1);const s=Math.floor(rt),f=Math.floor((rt-s)*60);
  $('#tc').textContent=`00:${String(s).padStart(2,'0')}:${String(f).padStart(2,'0')}`;
  $('#prog').style.width=(t/DUR*100)+'%';
  let i=0;SECS.forEach((x,j)=>{if(t>=x[0])i=j});
  const el=$('#sec');el.textContent=SECS[i][1];
  const p=E.outExpo(k(t,SECS[i][0],SECS[i][0]+.45));el.style.transform=`translateY(${(1-p)*100}%)`;
}

/* ---------- S1: точка → линия → арки ---------- */
const AR=(cx,cy,w,h)=>{const x0=cx-w/2,x1=cx+w/2,y0=cy-h/2,y1=cy+h/2,s=y0+h*.43;
  return `M${x0} ${y1}L${x0} ${s}Q${x0} ${y0+h*.11} ${cx} ${y0}Q${x1} ${y0+h*.11} ${x1} ${s}L${x1} ${y1}`};
const archEls=[];
[[400,560,4],[470,640,1.6],[540,720,1]].forEach(([w,h,sw],i)=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',AR(960,560,w,h));p.setAttribute('stroke-width',sw);$('#s1arches').append(p);archEls.push(p)});
const archLen=archEls.map(p=>p.getTotalLength());
// полумесяц внутри арки
(function(){const g=$('#s1star');const P='M18.82 9.06A12 12 0 1 0 31.47 24.52A10 10 0 0 1 18.82 9.06Z';
  const fill=document.createElementNS('http://www.w3.org/2000/svg','path');fill.setAttribute('d',P);fill.setAttribute('fill','#D9B26A');fill.setAttribute('stroke','none');fill.id='moonFill';
  const line=document.createElementNS('http://www.w3.org/2000/svg','path');line.setAttribute('d',P);line.setAttribute('stroke-width','.35');line.id='moonLine';
  const wrap=document.createElementNS('http://www.w3.org/2000/svg','g');wrap.setAttribute('transform','scale(7) translate(-21 -20)');wrap.append(fill,line);g.append(wrap)})();
const parts=[];seed=7;for(let i=0;i<46;i++){const d=document.createElement('i');css(d,{position:'absolute',width:'5px',height:'5px',borderRadius:'50%',background:'#D9B26A'});$('#s1parts').append(d);
  parts.push({el:d,a:rnd()*Math.PI*2,r:180+rnd()*520,s:.4+rnd()*1.2,d:rnd()*.3})}
function S1(t){
  const dot=$('#s1dot'),line=$('#s1line');
  const pop=E.outBack(k(t,0,.28),2.6);
  const st=E.ioExpo(k(t,.3,.72));
  const w=lerp(28,400,st)*(st>0?1:pop), h=lerp(28,4,st)*(st>0?1:pop);
  const drop=E.ioExpo(k(t,.72,1.0));
  if(t<.3){dot.setAttribute('cx',960);dot.setAttribute('cy',560);dot.setAttribute('r',14*pop);line.setAttribute('width',0)}
  else{dot.setAttribute('r',0);line.setAttribute('x',960-w/2);line.setAttribute('y',lerp(560,840,drop)-h/2);line.setAttribute('width',w*(1-k(t,.95,1.05)));line.setAttribute('height',h);line.setAttribute('rx',h/2)}
  archEls.forEach((p,i)=>{const d=E.ioCubic(k(t,.78+i*.08,1.32+i*.06));p.style.strokeDasharray=archLen[i];p.style.strokeDashoffset=archLen[i]*(1-d);p.style.opacity=i?.55:1});
  const sg=$('#s1star');const mq=k(t,.85,1.4);sg.setAttribute('transform',`translate(960 560) rotate(${lerp(-35,0,E.outExpo(mq))}) scale(${lerp(.6,1,E.outBack(mq,1.4))})`);sg.style.opacity=mq>0?1:0;
  const ml=$('#moonLine'),mL=ml.getTotalLength();ml.style.strokeDasharray=mL;ml.style.strokeDashoffset=mL*(1-E.ioCubic(k(t,.85,1.25)));
  $('#moonFill').style.opacity=.85*E.outCubic(k(t,1.1,1.45));
  parts.forEach(p=>{const q=k(t,.95+p.d,1.5);const r=p.r*E.outExpo(q);css(p.el,{left:960+Math.cos(p.a)*r+'px',top:560+Math.sin(p.a)*r*.8+'px',opacity:q>0?(1-q):0,transform:`scale(${p.s})`})});
}

/* ---------- S2: арка-окно → минареты, надпись между слоями ---------- */
const w2=$('#word2');'UMRA YOUTH'.split('').forEach(c=>{const s=document.createElement('span');s.textContent=c===' '?' ':c;w2.append(s)});
function S2(t){
  // окно-арка раскрывается на весь экран
  const g=E.ioExpo(k(t,1.42,2.25)), s=lerp(1,7.5,g);
  const cy=lerp(560,700,g);
  $('#s2clip').style.clipPath=`path('${AR(960,cy,400*s,560*s)}Z')`;
  const cam=E.outCubic(k(t,1.5,3.1));
  $('#s2bg').style.transform=`scale(${lerp(1.55,1.12,cam)}) translateY(${lerp(40,0,cam)}px)`;
  $('#s2fg').style.transform=`scale(${lerp(1.62,1.12,cam)}) translateY(${lerp(70,0,cam)}px)`;
  $('#s2bg').style.transformOrigin=$('#s2fg').style.transformOrigin='50% 75%';
  [...w2.children].forEach((sp,i)=>{const q=k(t,2.02+i*.035,2.5+i*.035);const e=E.outBack(q,1.6);
    css(sp,{transform:`translateY(${(1-e)*-420}px) scale(${lerp(1.4,1,E.outExpo(q))})`,opacity:q>0?1:0,filter:`blur(${(1-E.outExpo(q))*10}px)`})});
  css(w2,{transform:`scale(${lerp(.92,1.02,cam)}) translateY(${lerp(30,0,cam)}px)`});
  const tq=E.outExpo(k(t,2.55,3.0));css($('#tag2'),{opacity:tq,transform:`translateY(${(1-tq)*20}px)`,letterSpacing:lerp(.3,.01,tq)+'em'});
  // резкая панорама вбок
  const wp=E.inExpo(k(t,3.08,3.5));$('#S2').style.transform=`translateX(${-wp*2300}px)`;
}

/* ---------- S3: кинетическая типографика ---------- */
const mk=(id,txt,wrap)=>{const el=$(id);txt.split('').forEach(c=>{const s=document.createElement('span');s.textContent=c;if(wrap){const m=document.createElement('span');m.className='mask';m.append(s);el.append(m)}else el.append(s)});return [...el.querySelectorAll(wrap?'.mask>span':'span')]};
const L1=mk('#w1','ВЕРА',true),L2=mk('#w2','МОЛОДОСТЬ',false),L3=mk('#w3','ВМЕСТЕ',false);
seed=3;const R3=L3.map(()=>({x:(rnd()-.5)*1600,y:(rnd()-.5)*900,r:(rnd()-.5)*160}));
$('#stack').innerHTML='<div>ВЕРА</div><div>МОЛОДОСТЬ</div><div>ВМЕСТЕ</div>';
function S3(t){
  const S=$('#S3');
  const bg=t<4?'#0E1636':t<4.5?'#D9B26A':t<5?'#FFF8EC':'#0E1636';S.style.background=bg;
  // въезд с панорамой
  const win=1-E.inExpo(k(t,3.08,3.5));S.style.transform=`translateX(${win*2300}px)`;
  show('#w1',t<4);show('#w2',t>=4&&t<4.5);show('#w3',t>=4.5&&t<5);show('#stack',t>=5);
  $('#w1').style.color='#D9B26A';$('#w1').style.fontSize='400px';
  L1.forEach((s,i)=>{const q=E.outExpo(k(t,3.5+i*.04,3.82+i*.04)),o=E.inExpo(k(t,3.86+i*.02,3.99+i*.02));s.style.transform=`translateY(${(1-q)*110-o*110}%)`});
  $('#w1').style.transform=`translateY(-54%) scale(${lerp(1.08,1,E.outCubic(k(t,3.45,4)))})`;
  $('#w2').style.color='#0E1636';$('#w2').style.fontSize='250px';

/* ---------- S4: карта из точек ---------- */
let DOTS=[];
const P=(lon,lat)=>[960+(lon-57.5)*26.5,560-(lat-35)*30.5];  // равнопромежуточная проекция, растянутая по широте
const CITY={almaty:[76.95,43.24],astana:[71.43,51.13],jeddah:[39.17,21.54],makkah:[39.83,21.42],madinah:[39.61,24.47]};
function hav(a,b){const R=6371,r=x=>x*Math.PI/180;const dl=r(b[1]-a[1]),dn=r(b[0]-a[0]);const h=Math.sin(dl/2)**2+Math.cos(r(a[1]))*Math.cos(r(b[1]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const KM=Math.round(hav(CITY.almaty,CITY.makkah)/10)*10;
const routes=[[CITY.almaty,CITY.makkah,5.95,-1],[CITY.astana,CITY.madinah,6.1,1]];
const labs=[['almaty','АЛМАТЫ','КАЗАХСТАН',1,[22,-70]],['astana','АСТАНА','КАЗАХСТАН',1,[22,-70]],['makkah','МЕККА','АЛЬ-МАСДЖИД АЛЬ-ХАРАМ',0,[-300,30]],['madinah','МЕДИНА','МЕЧЕТЬ ПРОРОКА ﷺ',0,[-250,-70]]];
labs.forEach(([key,name,sub,g])=>{const d=document.createElement('div');d.className='lab'+(g?' g':'');d.dataset.k=key;d.innerHTML=`${sub}<b>${name}</b>`;$('#labs').append(d)});
function bez(a,b,c,u){return[(1-u)*(1-u)*a[0]+2*(1-u)*u*b[0]+u*u*c[0],(1-u)*(1-u)*a[1]+2*(1-u)*u*b[1]+u*u*c[1]]}
function ctrl(a,b,side){const m=[(a[0]+b[0])/2,(a[1]+b[1])/2],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);return [m[0]-dy/L*L*.28*side,m[1]+dx/L*L*.28*side]}
const PLANE=new Path2D('M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z');
function S4(t){
  const cv=$('#map'),c=cv.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);
  // камера: медленный наезд, в конце — нырок в Мекку
  const mk=P(...CITY.makkah);
  const z0=lerp(1.18,1.0,E.outCubic(k(t,5.5,7.6))), dive=E.inExpo(k(t,7.55,8.0));
  const z=z0*lerp(1,9,dive);
  const fx=lerp(960,mk[0],dive*0+E.ioCubic(k(t,7.4,8))), fy=lerp(560,mk[1],E.ioCubic(k(t,7.4,8)));
  const tf=(x,y)=>[(x-fx)*z+960+(1-E.outCubic(k(t,5.5,7.6)))*-60,(y-fy)*z+540];
  const ori=P(...CITY.almaty);
  for(const d of DOTS){const [x,y]=d.p;const dist=Math.hypot(x-ori[0],y-ori[1]);const q=k(t,5.5+dist*.00055,5.85+dist*.00055);if(q<=0)continue;
    const [X,Y]=tf(x,y);if(X<-20||X>W+20||Y<-20||Y>H+20)continue;
    const hl=d.c==1?k(t,5.75,6.1):d.c==2?k(t,6.6,7.0):0;
    c.fillStyle=d.c==1?`rgba(217,178,106,${.22+.7*hl})`:d.c==2?`rgba(255,248,236,${.22+.55*hl})`:'rgba(255,248,236,.2)';
    const r=(d.c?3.4:2.7)*E.outBack(q,2.2)*Math.min(z,2.4);c.beginPath();c.arc(X,Y,r,0,6.283);c.fill()}
  // маршруты
  routes.forEach(([a0,b0,st,side],ri)=>{const a=P(...a0),b=P(...b0),m=ctrl(a,b,side);const q=E.ioCubic(k(t,st,st+1.25));if(q<=0)return;
    c.lineWidth=3;c.lineCap='round';const N=90;
    for(let i=0;i<N*q;i++){const u0=i/N,u1=Math.min(q,(i+1)/N);const p0=tf(...bez(a,m,b,u0)),p1=tf(...bez(a,m,b,u1));
      const al=.25+.75*(u1/q);c.strokeStyle=`rgba(240,209,147,${al})`;c.beginPath();c.moveTo(...p0);c.lineTo(...p1);c.stroke()}
    // самолёт
    if(q<1||t<st+1.6){const u=q,p=tf(...bez(a,m,b,u)),p2=tf(...bez(a,m,b,Math.min(1,u+.01)));const ang=Math.atan2(p2[1]-p[1],p2[0]-p[0]);
      c.save();c.translate(...p);c.rotate(ang+Math.PI/2);c.scale(1.6,1.6);c.translate(-12,-12);c.shadowColor='rgba(240,209,147,.9)';c.shadowBlur=14;c.fillStyle='#fff';c.fill(PLANE);c.restore()}
  });
  // пульс городов
  Object.entries(CITY).forEach(([key,ll],i)=>{if(key==='jeddah')return;const [X,Y]=tf(...P(...ll));const on=key=='almaty'||key=='astana'?k(t,5.8,6):k(t,7.0,7.2);if(on<=0)return;
    for(let j=0;j<2;j++){const ph=((t*1.2+j*.5+i*.13)%1);c.strokeStyle=`rgba(217,178,106,${(1-ph)*.8*on})`;c.lineWidth=2;c.beginPath();c.arc(X,Y,8+ph*38,0,6.283);c.stroke()}
    c.fillStyle='#F0D193';c.beginPath();c.arc(X,Y,7*E.outBack(on),0,6.283);c.fill()});
  // подписи
  document.querySelectorAll('.lab').forEach((el,i)=>{const L=labs[i];const [X,Y]=tf(...P(...CITY[L[0]]));const on=L[3]?k(t,5.85+i*.08,6.25+i*.08):k(t,7.0+(i-2)*.1,7.4+(i-2)*.1);
    const e=E.outExpo(on);css(el,{left:X+L[4][0]+'px',top:Y+L[4][1]+'px',opacity:on*(1-dive*3),transform:`translateY(${(1-e)*24}px)`,clipPath:`inset(0 ${(1-e)*100}% 0 0)`})});
  const kq=E.ioCubic(k(t,5.95,7.2));$('#kmn').textContent=Math.round(KM*kq).toLocaleString('en-US').replace(/,/g,' ');
  const ke=E.outExpo(k(t,5.7,6.1));css($('#km'),{opacity:ke*(1-dive*3),transform:`translateY(${(1-ke)*40}px)`});
  $('#S4').style.clipPath=`circle(${E.ioExpo(k(t,5.2,5.62))*1200}px at 960px 540px)`;
}
